name: Sync upstream and publish custom image

on:
  schedule:
    - cron: '20 20 * * *' # 04:20 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [codex/custom-beian-footer]

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: custom-upstream-sync
  cancel-in-progress: false

env:
  CUSTOM_BRANCH: codex/custom-beian-footer
  UPSTREAM_URL: https://github.com/liketrek/TREK.git
  UPSTREAM_BRANCH: main

jobs:
  sync-build:
    if: github.repository == 'mantra50/TREK'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CUSTOM_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Prepare upstream merge
        id: merge
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch "$UPSTREAM_URL" "$UPSTREAM_BRANCH"
          upstream_sha=$(git rev-parse FETCH_HEAD)
          if git merge --no-edit "$upstream_sha"; then
            echo 'conflict=false' >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            review_branch="sync/upstream-${upstream_sha:0:12}"
            git push origin "$upstream_sha:refs/heads/$review_branch"
            existing=$(gh pr list --base "$CUSTOM_BRANCH" --head "$review_branch" --state open --json number --jq 'length')
            if [ "$existing" = 0 ]; then
              gh pr create --base "$CUSTOM_BRANCH" --head "$review_branch" \
                --title 'chore: resolve upstream sync conflicts' \
                --body 'Automatic merging of upstream main into the custom branch encountered conflicts. Resolve them and merge this PR; the custom-branch push workflow will validate and publish the result. No deployment or custom branch overwrite was performed.'
            fi
            echo 'conflict=true' >> "$GITHUB_OUTPUT"
            echo '::error::Upstream merge has conflicts. Resolve the synchronization PR.'
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and validate
        run: |
          npm ci
          npm run build --workspace=shared
          npm run typecheck --workspace=shared
          npm run typecheck --workspace=server
          npm run typecheck --workspace=client
          npm run lint:pages --workspace=client
          npm test
          npm ci --prefix plugin-sdk
          npm run typecheck --prefix plugin-sdk
          npm test --prefix plugin-sdk

      - name: Resolve version and image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          for package in client server shared; do
            actual=$(node -p "require('./$package/package.json').version")
            test "$actual" = "$version"
          done
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha=$(git rev-parse --short=12 HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$version-custom-$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build custom image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.image.outputs.version }}
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container health
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs trek-sync-check; docker rm -f trek-sync-check' EXIT
          docker run -d --name trek-sync-check "$IMAGE"
          healthy=false
          for attempt in $(seq 1 30); do
            if docker exec trek-sync-check wget -qO- http://localhost:3000/api/health; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
          docker exec trek-sync-check test -x /usr/local/bin/kitinerary-extractor

      - name: Advance custom branch after validation
        run: git push origin "HEAD:refs/heads/$CUSTOM_BRANCH"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker push "$IMAGE:$TAG"
          docker tag "$IMAGE:$TAG" "$IMAGE:custom-latest"
          docker push "$IMAGE:custom-latest"
          echo "Published $IMAGE:$TAG and $IMAGE:custom-latest" >> "$GITHUB_STEP_SUMMARY"
